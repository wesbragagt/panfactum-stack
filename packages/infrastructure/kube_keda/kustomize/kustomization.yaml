apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - resources.yaml
patches:
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: keda-operator-tls-certificates
    patch: |-
      - op: replace
        path: /spec/privateKey
        value:
          algorithm: ECDSA
          size: 256
          rotationPolicy: Always
