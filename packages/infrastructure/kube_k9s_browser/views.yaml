views:
  v1/nodes:
    columns:
      - NAME
      - STATUS
      # Karpenter sets capacity-type; Talos-managed nodes set lifecycle.
      - CAPACITY:.metadata.labels['karpenter\.sh/capacity-type','node\.kubernetes\.io/lifecycle']
      - ROLE:.metadata.labels.node\.kubernetes\.io/role
      - INSTANCE:.metadata.labels.node\.kubernetes\.io/instance-type
      - ZONE:.metadata.labels.topology\.kubernetes\.io/zone
      - CPU
      - CPU/A
      - "%CPU"
      - MEM
      - MEM/A
      - "%MEM"
      - VERSION
      - PODS
      - AGE
      # k9s appends unlisted default columns; |H hides one.
      - GPU/A|H
      - GPU/C|H
      - SH-GPU/A|H
      - SH-GPU/C|H
